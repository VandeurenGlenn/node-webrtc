name: Cross Platform Source Build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop

jobs:
  source-build:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [26]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Install ninja (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libglib2.0-dev libasound2-dev libpulse-dev gcc-12 g++-12
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 120 --slave /usr/bin/g++ g++ /usr/bin/g++-12
          sudo update-alternatives --set gcc /usr/bin/gcc-12
      - name: Build from source (Linux)
        if: runner.os == 'Linux'
        env:
          SKIP_DOWNLOAD: true
          CMAKE_GENERATOR: Ninja
        run: npm install

      - name: Smoke load addon
        run: node -e "const wrtc=require('./'); console.log('wrtc ok', !!wrtc);"

      - name: Benchmark smoke
        run: node benchmarks/run.js --iterations 1 --warmup 0 --messages 5

      - name: Package Linux addon
        if: runner.os == 'Linux'
        shell: bash
        run: |
          version=$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")
          test -s build/Release/wrtc.node
          mkdir -p artifacts
          tar -czf "artifacts/wrtc-v${version}-napi-v3-linux-x64.tar.gz" -C build/Release wrtc.node

      - name: Preserve tested Linux addon
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: wrtc-linux-x64
          path: artifacts/*.tar.gz
          if-no-files-found: error

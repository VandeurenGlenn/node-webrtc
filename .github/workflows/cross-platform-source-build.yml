name: Cross Platform Source Build

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    tags:
      - "v*"
  pull_request:
    branches:
      - develop
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tooling:
    name: Lint and dependency audit
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.15

      - name: Install development dependencies
        run: npm install --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Build JavaScript library
        run: npm run build:lib

      - name: Verify generated library is current
        run: git diff --exit-code -- lib

      - name: Audit dependencies
        run: npm audit --audit-level=low

  source-build:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 26
            generator: Ninja
            webrtc_config: cmake/webrtc-linux.cmake
            script_suffix: sh
            platform_patch_1: cmake/webrtc-linux.cmake
            platform_patch_2: cmake/webrtc-linux.cmake
            legacy_artifact: ""
          - os: windows-2022
            node: 26
            generator: Ninja
            webrtc_config: cmake/webrtc-windows.cmake
            script_suffix: bat
            platform_patch_1: scripts/patch-webrtc-windows.py
            platform_patch_2: scripts/patch-webrtc-boringssl-prefix.py
            legacy_artifact: ""
          - os: macos-latest
            node: 26
            generator: Ninja
            webrtc_config: cmake/webrtc-macos.cmake
            script_suffix: sh
            platform_patch_1: scripts/patch-webrtc-apple-clt.py
            platform_patch_2: scripts/patch-webrtc-apple-clt-modern.py
            legacy_artifact: libwebrtc-macOS-ARM64-9e95c104df6f60dd7e91a567f250ef151a2556785012e625a08d492de19c36d2-macos26

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Locate Visual Studio 2022
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere `
            -latest `
            -version '[17.0,18.0)' `
            -products '*' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $installPath) {
            throw 'Visual Studio 2022 with C++ build tools was not found'
          }
          foreach ($command in 'clang-cl', 'lld-link', 'ninja') {
            if (-not (Get-Command $command -ErrorAction SilentlyContinue)) {
              throw "$command was not found on PATH"
            }
          }
          $resourceCompiler = Get-ChildItem `
            "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\rc.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $resourceCompiler) {
            throw 'The Windows SDK resource compiler was not found'
          }
          "vs2022_install=$installPath" >> $env:GITHUB_ENV
          "RC=$resourceCompiler" >> $env:GITHUB_ENV
          Write-Host "Using Visual Studio SDK from $installPath with clang-cl, lld-link, and Ninja"
          Write-Host "Using Windows resource compiler $resourceCompiler"

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libglib2.0-dev libasound2-dev libpulse-dev

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Find matching WebRTC prebuilt
        id: prebuilt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_BASE: libwebrtc-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cmake/webrtc-common.cmake', matrix.webrtc_config, format('scripts/download-webrtc.{0}', matrix.script_suffix), format('scripts/configure-webrtc.{0}', matrix.script_suffix), format('scripts/build-webrtc.{0}', matrix.script_suffix), 'scripts/patch-webrtc-base64.sh', 'scripts/patch-webrtc-modern-cpp.py', 'scripts/patch-webrtc-media-defaults.sh', matrix.platform_patch_1, matrix.platform_patch_2, 'scripts/stage-webrtc-prebuilt.js') }}
          LEGACY_ARTIFACT_NAME: ${{ matrix.legacy_artifact }}
        run: |
          ARTIFACT_NAME="$ARTIFACT_BASE-${ImageOS:-unknown}"
          run_id="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$ARTIFACT_NAME&per_page=100" \
              --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty'
          )"
          if [ -z "$run_id" ] && [ -n "$LEGACY_ARTIFACT_NAME" ]; then
            run_id="$(
              gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$LEGACY_ARTIFACT_NAME&per_page=100" \
                --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty'
            )"
            if [ -n "$run_id" ]; then
              ARTIFACT_NAME="$LEGACY_ARTIFACT_NAME"
              echo "Using verified legacy artifact while platform-specific keys are bootstrapped"
            fi
          fi
          echo "name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
          if [ -n "$run_id" ]; then
            echo "Found $ARTIFACT_NAME in run $run_id"
          else
            echo "No matching prebuilt; this job will perform a full WebRTC build"
          fi

      - name: Download matching WebRTC prebuilt
        if: steps.prebuilt.outputs.run-id != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ steps.prebuilt.outputs.name }}
          ARTIFACT_RUN_ID: ${{ steps.prebuilt.outputs.run-id }}
        run: |
          gh run download "$ARTIFACT_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$ARTIFACT_NAME" \
            --dir build/external/libwebrtc

      - name: Prepare WebRTC prebuilt layout
        if: steps.prebuilt.outputs.run-id != ''
        run: node scripts/prepare-webrtc-prebuilt.js

      - name: Install package dependencies
        run: npm install --ignore-scripts --omit=dev

      - name: Build from source
        env:
          CMAKE_GENERATOR: ${{ matrix.generator }}
          SKIP_DOWNLOAD: true
          USE_CLANG_CL: 1
          WEBRTC_PREBUILT: ${{ steps.prebuilt.outputs.run-id != '' && '1' || '0' }}
        run: npm run build

      - name: Stage WebRTC prebuilt
        id: stage-prebuilt
        if: always() && steps.prebuilt.outputs.run-id == ''
        run: node scripts/stage-webrtc-prebuilt.js

      - name: Preserve WebRTC prebuilt
        if: always() && steps.prebuilt.outputs.run-id == '' && steps.stage-prebuilt.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.prebuilt.outputs.name }}
          path: .webrtc-prebuilt/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

      - name: Smoke load addon
        run: node -e "const wrtc=require('./'); console.log('wrtc ok', !!wrtc);"

      - name: Benchmark smoke
        run: node benchmarks/run.js --iterations 1 --warmup 0 --messages 5

      - name: Find benchmark baseline
        id: benchmark-baseline
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BENCHMARK_ARTIFACT: benchmark-${{ runner.os }}-${{ runner.arch }}
        run: |
          mkdir -p benchmarks/ci-baseline
          while IFS= read -r run_id; do
            if gh run download "$run_id" \
              --repo "$GITHUB_REPOSITORY" \
              --name "$BENCHMARK_ARTIFACT" \
              --dir benchmarks/ci-baseline 2>/dev/null; then
              baseline_file="$(find benchmarks/ci-baseline -type f -name '*.json' | head -n 1)"
              if [ -n "$baseline_file" ]; then
                echo "path=$baseline_file" >> "$GITHUB_OUTPUT"
                echo "Using benchmark baseline from develop run $run_id"
                exit 0
              fi
            fi
          done < <(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow cross-platform-source-build.yml \
              --branch develop \
              --event push \
              --status success \
              --limit 20 \
              --json databaseId \
              --jq '.[].databaseId'
          )
          echo "No platform baseline found; this run will establish one"

      - name: Run stable benchmarks
        shell: bash
        env:
          BASELINE_PATH: ${{ steps.benchmark-baseline.outputs.path }}
          BENCHMARK_OUTPUT: benchmarks/results/${{ runner.os }}-${{ runner.arch }}.json
        run: |
          baseline_args=()
          if [ -n "$BASELINE_PATH" ]; then
            baseline_args=(--baseline "$BASELINE_PATH")
          fi
          node benchmarks/run.js \
            --iterations 5 \
            --warmup 1 \
            --compare-runs 3 \
            --messages 10 \
            --output "$BENCHMARK_OUTPUT" \
            "${baseline_args[@]}"

      - name: Preserve benchmark result
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-${{ runner.os }}-${{ runner.arch }}
          path: benchmarks/results/${{ runner.os }}-${{ runner.arch }}.json
          if-no-files-found: error
          retention-days: 90

      - name: Package native addon
        run: npm run node-pre-gyp-package

      - name: Preserve tested native addon
        uses: actions/upload-artifact@v7
        with:
          name: wrtc-${{ runner.os }}-${{ runner.arch }}
          path: build/stage/**/*.tar.gz
          if-no-files-found: error

  benchmark-report:
    name: Visual benchmark report
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    needs: source-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download benchmark results
        uses: actions/download-artifact@v7
        with:
          pattern: benchmark-*
          path: benchmark-artifacts

      - name: Render benchmark report
        run: node scripts/render-benchmark-report.js benchmark-artifacts benchmark-report

      - name: Add report to workflow summary
        run: cat benchmark-report/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve visual dashboard
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-dashboard
          path: benchmark-report/
          if-no-files-found: error
          retention-days: 90

  deploy-benchmark-pages:
    name: Publish benchmark dashboard
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    needs: benchmark-report
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download visual dashboard
        uses: actions/download-artifact@v7
        with:
          name: benchmark-dashboard
          path: benchmark-report

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: benchmark-report

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download exact-tree PR artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag_tree="$(git rev-parse 'HEAD^{tree}')"
          build_run_id=""

          while IFS=$'\t' read -r run_id head_sha; do
            candidate_tree="$(
              gh api "repos/$GITHUB_REPOSITORY/git/commits/$head_sha" \
                --jq '.tree.sha' 2>/dev/null || true
            )"
            if [ "$candidate_tree" != "$tag_tree" ]; then
              continue
            fi

            artifact_count="$(
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" \
                --jq '[.artifacts[] | select(.expired == false and (.name | startswith("wrtc-")))] | length'
            )"
            if [ "$artifact_count" -eq 3 ]; then
              build_run_id="$run_id"
              break
            fi
          done < <(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow cross-platform-source-build.yml \
              --event pull_request \
              --status success \
              --limit 100 \
              --json databaseId,headSha \
              --jq '.[] | [.databaseId, .headSha] | @tsv'
          )

          if [ -z "$build_run_id" ]; then
            echo "No successful PR build with three live artifacts matches tree $tag_tree" >&2
            exit 1
          fi

          echo "Promoting artifacts from PR workflow run $build_run_id"
          gh run download "$build_run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'wrtc-*' \
            --dir release-assets

      - name: Validate release inputs
        shell: bash
        run: |
          expected_tag="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $expected_tag" >&2
            exit 1
          fi

          asset_count="$(find release-assets -type f -name '*.tar.gz' | wc -l | tr -d ' ')"
          if [ "$asset_count" -ne 3 ]; then
            echo "Expected 3 native archives, found $asset_count" >&2
            find release-assets -type f -print
            exit 1
          fi

          while IFS= read -r asset; do
            tar -tzf "$asset" | grep -qx 'Release/wrtc.node'
          done < <(find release-assets -type f -name '*.tar.gz' | sort)

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mapfile -t assets < <(find release-assets -type f -name '*.tar.gz' | sort)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --verify-tag \
              --generate-notes \
              --title "@vandeurenglenn/wrtc $GITHUB_REF_NAME"
          fi

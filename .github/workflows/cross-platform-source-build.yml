name: Cross Platform Source Build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-build:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 26
            generator: Ninja
          - os: windows-latest
            node: 26
            generator: Visual Studio 17 2022
          - os: macos-latest
            node: 26
            generator: Ninja

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libglib2.0-dev libasound2-dev libpulse-dev gcc-12 g++-12
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 120 --slave /usr/bin/g++ g++ /usr/bin/g++-12
          sudo update-alternatives --set gcc /usr/bin/gcc-12

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install package dependencies
        run: npm install --ignore-scripts

      - name: Build from source
        env:
          CMAKE_GENERATOR: ${{ matrix.generator }}
          SKIP_DOWNLOAD: true
        run: npm run build

      - name: Smoke load addon
        run: node -e "const wrtc=require('./'); console.log('wrtc ok', !!wrtc);"

      - name: Benchmark smoke
        run: node benchmarks/run.js --iterations 1 --warmup 0 --messages 5

      - name: Package native addon
        run: npm run node-pre-gyp-package

      - name: Preserve tested native addon
        uses: actions/upload-artifact@v4
        with:
          name: wrtc-${{ runner.os }}-${{ runner.arch }}
          path: build/stage/**/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: source-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download tested native addons
        uses: actions/download-artifact@v4
        with:
          pattern: wrtc-*
          path: release-assets
          merge-multiple: true

      - name: Validate release inputs
        shell: bash
        run: |
          expected_tag="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $expected_tag" >&2
            exit 1
          fi

          asset_count="$(find release-assets -type f -name '*.tar.gz' | wc -l | tr -d ' ')"
          if [ "$asset_count" -ne 3 ]; then
            echo "Expected 3 native archives, found $asset_count" >&2
            find release-assets -type f -print
            exit 1
          fi

          while IFS= read -r asset; do
            tar -tzf "$asset" | grep -qx 'Release/wrtc.node'
          done < <(find release-assets -type f -name '*.tar.gz' | sort)

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mapfile -t assets < <(find release-assets -type f -name '*.tar.gz' | sort)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --verify-tag \
              --generate-notes \
              --title "@vandeurenglenn/wrtc $GITHUB_REF_NAME"
          fi

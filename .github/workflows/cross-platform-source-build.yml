name: Cross Platform Source Build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-build:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 26
            generator: Ninja
          - os: windows-2022
            node: 26
            generator: Visual Studio 17 2022
          - os: macos-latest
            node: 26
            generator: Ninja

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Locate Visual Studio 2022
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere `
            -latest `
            -version '[17.0,18.0)' `
            -products '*' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $installPath) {
            throw 'Visual Studio 2022 with C++ build tools was not found'
          }
          "vs2022_install=$installPath" >> $env:GITHUB_ENV
          Write-Host "Using Visual Studio from $installPath"

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libglib2.0-dev libasound2-dev libpulse-dev

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Find matching WebRTC prebuilt
        id: prebuilt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_BASE: libwebrtc-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('CMakeLists.txt', 'scripts/download-webrtc.*', 'scripts/configure-webrtc.*', 'scripts/build-webrtc.*', 'scripts/patch-webrtc-*', 'scripts/stage-webrtc-prebuilt.js') }}
        run: |
          ARTIFACT_NAME="$ARTIFACT_BASE-${ImageOS:-unknown}"
          run_id="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$ARTIFACT_NAME&per_page=100" \
              --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty'
          )"
          echo "name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
          if [ -n "$run_id" ]; then
            echo "Found $ARTIFACT_NAME in run $run_id"
          else
            echo "No matching prebuilt; this job will perform a full WebRTC build"
          fi

      - name: Download matching WebRTC prebuilt
        if: steps.prebuilt.outputs.run-id != ''
        uses: actions/download-artifact@v7
        with:
          name: ${{ steps.prebuilt.outputs.name }}
          path: build/external/libwebrtc
          repository: ${{ github.repository }}
          run-id: ${{ steps.prebuilt.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Install package dependencies
        run: npm install --ignore-scripts

      - name: Build from source
        env:
          CMAKE_GENERATOR: ${{ matrix.generator }}
          SKIP_DOWNLOAD: true
          WEBRTC_PREBUILT: ${{ steps.prebuilt.outputs.run-id != '' && '1' || '0' }}
        run: npm run build

      - name: Stage WebRTC prebuilt
        if: steps.prebuilt.outputs.run-id == ''
        run: node scripts/stage-webrtc-prebuilt.js

      - name: Preserve WebRTC prebuilt
        if: steps.prebuilt.outputs.run-id == ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.prebuilt.outputs.name }}
          path: .webrtc-prebuilt/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

      - name: Smoke load addon
        run: node -e "const wrtc=require('./'); console.log('wrtc ok', !!wrtc);"

      - name: Benchmark smoke
        run: node benchmarks/run.js --iterations 1 --warmup 0 --messages 5

      - name: Package native addon
        run: npm run node-pre-gyp-package

      - name: Preserve tested native addon
        uses: actions/upload-artifact@v7
        with:
          name: wrtc-${{ runner.os }}-${{ runner.arch }}
          path: build/stage/**/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download exact-tree PR artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag_tree="$(git rev-parse 'HEAD^{tree}')"
          build_run_id=""

          while IFS=$'\t' read -r run_id head_sha; do
            candidate_tree="$(
              gh api "repos/$GITHUB_REPOSITORY/git/commits/$head_sha" \
                --jq '.tree.sha' 2>/dev/null || true
            )"
            if [ "$candidate_tree" != "$tag_tree" ]; then
              continue
            fi

            artifact_count="$(
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" \
                --jq '[.artifacts[] | select(.expired == false and (.name | startswith("wrtc-")))] | length'
            )"
            if [ "$artifact_count" -eq 3 ]; then
              build_run_id="$run_id"
              break
            fi
          done < <(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow cross-platform-source-build.yml \
              --event pull_request \
              --status success \
              --limit 100 \
              --json databaseId,headSha \
              --jq '.[] | [.databaseId, .headSha] | @tsv'
          )

          if [ -z "$build_run_id" ]; then
            echo "No successful PR build with three live artifacts matches tree $tag_tree" >&2
            exit 1
          fi

          echo "Promoting artifacts from PR workflow run $build_run_id"
          gh run download "$build_run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'wrtc-*' \
            --dir release-assets

      - name: Validate release inputs
        shell: bash
        run: |
          expected_tag="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $expected_tag" >&2
            exit 1
          fi

          asset_count="$(find release-assets -type f -name '*.tar.gz' | wc -l | tr -d ' ')"
          if [ "$asset_count" -ne 3 ]; then
            echo "Expected 3 native archives, found $asset_count" >&2
            find release-assets -type f -print
            exit 1
          fi

          while IFS= read -r asset; do
            tar -tzf "$asset" | grep -qx 'Release/wrtc.node'
          done < <(find release-assets -type f -name '*.tar.gz' | sort)

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mapfile -t assets < <(find release-assets -type f -name '*.tar.gz' | sort)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --verify-tag \
              --generate-notes \
              --title "@vandeurenglenn/wrtc $GITHUB_REF_NAME"
          fi

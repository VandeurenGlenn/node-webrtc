name: Cross Platform Source Build

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    tags:
      - "v*"
  pull_request:
    branches:
      - develop
    paths-ignore:
      - "README.md"
      - "docs/**"

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changes
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    outputs:
      source_build: ${{ steps.classify.outputs.source_build }}
      native: ${{ steps.classify.outputs.native }}
      performance: ${{ steps.classify.outputs.performance }}
      alternative_benchmarks: ${{ steps.classify.outputs.alternative_benchmarks }}
      wpt: ${{ steps.classify.outputs.wpt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          source_build=false
          native=false
          performance=false
          alternative_benchmarks=false
          wpt=false

          while IFS= read -r file; do
            case "$file" in
              CMakeLists.txt|cmake/*|src/*.cc|src/*.h|scripts/build-from-source.js|scripts/clean-package-build.js|scripts/configure-webrtc.*|scripts/download-webrtc.*|scripts/build-webrtc.*|scripts/patch-webrtc-*|scripts/prepare-webrtc-prebuilt.js|scripts/stage-webrtc-prebuilt.js)
                source_build=true
                native=true
                performance=true
                wpt=true
                ;;
              package.json|package-lock.json|rollup.config.js|src/lib/*|lib/*)
                source_build=true
                performance=true
                wpt=true
                ;;
              benchmarks/run.js|benchmarks/unsupported-result.js|scripts/benchmark-alternatives.sh)
                source_build=true
                performance=true
                alternative_benchmarks=true
                ;;
              benchmarks/run-paired.js)
                source_build=true
                performance=true
                ;;
              test/web-platform-tests/*|scripts/generate-wpt-hosts.js|scripts/patch-wpt-python3.js|scripts/reset-wpt.js|scripts/summarize-wpt.js)
                source_build=true
                wpt=true
                ;;
              test/benchmark-report.js|scripts/render-benchmark-report.js|README.md|docs/*)
                ;;
              .github/workflows/cross-platform-source-build.yml)
                # Workflow changes get one complete validation run.
                source_build=true
                native=true
                performance=true
                alternative_benchmarks=true
                wpt=true
                ;;
              *)
                # Unknown code or configuration is validated conservatively.
                source_build=true
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

          echo "source_build=$source_build" >> "$GITHUB_OUTPUT"
          echo "native=$native" >> "$GITHUB_OUTPUT"
          echo "performance=$performance" >> "$GITHUB_OUTPUT"
          echo "alternative_benchmarks=$alternative_benchmarks" >> "$GITHUB_OUTPUT"
          echo "wpt=$wpt" >> "$GITHUB_OUTPUT"
          printf 'source-build=%s\nnative=%s\nperformance=%s\nalternative-benchmarks=%s\nwpt=%s\n' \
            "$source_build" "$native" "$performance" "$alternative_benchmarks" "$wpt"

  tooling:
    name: Lint and dependency audit
    if: ${{ github.event_name != 'push' && !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.15

      - name: Install development dependencies
        run: npm install --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Build JavaScript library
        run: npm run build:lib

      - name: Verify generated library is current
        run: git diff --exit-code -- lib

      - name: Run tooling tests
        run: |
          node --test test/benchmark-report.js test/benchmark-provenance.js test/rtp-stats-compatibility.js test/wpt-upstream-stats.js test/install-linux-dependencies.js
          node scripts/summarize-wpt.js "$RUNNER_TEMP/wpt-summary.json"

      - name: Audit dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            audit_status=0
            npm audit --audit-level=low --json > npm-audit.json || audit_status=$?
            cat npm-audit.json
            if [ "$audit_status" -eq 0 ]; then
              exit 0
            fi
            if ! node -e 'const report=require("./npm-audit.json"); process.exit(report.error ? 0 : 1)'; then
              exit "$audit_status"
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Audit service unavailable; retrying ($attempt/3)"
              sleep 10
            fi
          done
          echo "::warning::npm audit service remained unavailable after 3 attempts"

  source-build:
    name: ${{ matrix.label || matrix.os }} / node ${{ matrix.node }}
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.source_build == 'true' }}
    needs: changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout_minutes || 60 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 26
            run_wpt: true
            cross_compile: false
            generator: Ninja
            webrtc_config: cmake/webrtc-linux.cmake
            script_suffix: sh
            platform_patch_1: cmake/webrtc-linux.cmake
            platform_patch_2: cmake/webrtc-linux.cmake
            legacy_artifact: ""
          - os: ubuntu-latest
            label: ubuntu-latest (linux arm64 cross)
            node: 26
            run_wpt: false
            cross_compile: true
            target_arch: arm64
            arm_tools_path: /usr
            artifact_os: Linux
            artifact_arch: ARM64
            generator: Ninja
            webrtc_config: cmake/webrtc-linux.cmake
            script_suffix: sh
            platform_patch_1: cmake/webrtc-linux.cmake
            platform_patch_2: cmake/webrtc-linux.cmake
            legacy_artifact: ""
          - os: windows-2022
            node: 26
            cross_compile: false
            generator: Ninja
            webrtc_config: cmake/webrtc-windows.cmake
            script_suffix: bat
            platform_patch_1: scripts/patch-webrtc-windows.py
            platform_patch_2: scripts/patch-webrtc-boringssl-prefix.py
            legacy_artifact: ""
          - os: macos-latest
            node: 26
            cross_compile: false
            generator: Ninja
            webrtc_config: cmake/webrtc-macos.cmake
            script_suffix: sh
            platform_patch_1: scripts/patch-webrtc-apple-clt.py
            platform_patch_2: scripts/patch-webrtc-apple-clt-modern.py
            legacy_artifact: ""
          - os: macos-15-intel
            node: 26
            cross_compile: false
            timeout_minutes: 120
            generator: Ninja
            webrtc_config: cmake/webrtc-macos.cmake
            script_suffix: sh
            platform_patch_1: scripts/patch-webrtc-apple-clt.py
            platform_patch_2: scripts/patch-webrtc-apple-clt-modern.py
            legacy_artifact: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Locate Visual Studio 2022
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere `
            -latest `
            -version '[17.0,18.0)' `
            -products '*' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $installPath) {
            throw 'Visual Studio 2022 with C++ build tools was not found'
          }
          foreach ($command in 'clang-cl', 'lld-link', 'ninja') {
            if (-not (Get-Command $command -ErrorAction SilentlyContinue)) {
              throw "$command was not found on PATH"
            }
          }
          $resourceCompiler = Get-ChildItem `
            "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\rc.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $resourceCompiler) {
            throw 'The Windows SDK resource compiler was not found'
          }
          "vs2022_install=$installPath" >> $env:GITHUB_ENV
          "RC=$resourceCompiler" >> $env:GITHUB_ENV
          Write-Host "Using Visual Studio SDK from $installPath with clang-cl, lld-link, and Ninja"
          Write-Host "Using Windows resource compiler $resourceCompiler"

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: bash scripts/install-linux-dependencies.sh ninja-build libglib2.0-dev libasound2-dev libpulse-dev

      - name: Install Linux ARM64 cross compiler
        if: matrix.cross_compile == true
        timeout-minutes: 10
        run: bash scripts/install-linux-dependencies.sh gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Find matching WebRTC prebuilt
        id: prebuilt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_BASE: libwebrtc-${{ matrix.artifact_os || runner.os }}-${{ matrix.artifact_arch || runner.arch }}-${{ hashFiles('cmake/webrtc-common.cmake', matrix.webrtc_config, format('scripts/download-webrtc.{0}', matrix.script_suffix), format('scripts/configure-webrtc.{0}', matrix.script_suffix), format('scripts/build-webrtc.{0}', matrix.script_suffix), 'scripts/patch-webrtc-base64.sh', 'scripts/patch-webrtc-modern-cpp.py', 'scripts/patch-webrtc-media-defaults.sh', matrix.platform_patch_1, matrix.platform_patch_2, 'scripts/stage-webrtc-prebuilt.js') }}
          LEGACY_ARTIFACT_NAME: ${{ matrix.legacy_artifact }}
        run: |
          ARTIFACT_NAME="$ARTIFACT_BASE-${ImageOS:-unknown}"
          run_id="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$ARTIFACT_NAME&per_page=100" \
              --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty'
          )"
          if [ -z "$run_id" ] && [ -n "$LEGACY_ARTIFACT_NAME" ]; then
            run_id="$(
              gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$LEGACY_ARTIFACT_NAME&per_page=100" \
                --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty'
            )"
            if [ -n "$run_id" ]; then
              ARTIFACT_NAME="$LEGACY_ARTIFACT_NAME"
              echo "Using verified legacy artifact while platform-specific keys are bootstrapped"
            fi
          fi
          echo "name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
          if [ -n "$run_id" ]; then
            echo "Found $ARTIFACT_NAME in run $run_id"
          else
            echo "No matching prebuilt; this job will perform a full WebRTC build"
          fi

      - name: Install Windows SDK 28000
        if: runner.os == 'Windows' && steps.prebuilt.outputs.run-id == ''
        shell: pwsh
        run: |
          $sdkInclude = "${env:ProgramFiles(x86)}\Windows Kits\10\Include\10.0.28000.0"
          if (-not (Test-Path $sdkInclude)) {
            $installer = Join-Path $env:RUNNER_TEMP 'winsdksetup.exe'
            Invoke-WebRequest `
              -Uri 'https://download.microsoft.com/download/38ab8f6d-3676-4860-ae84-3361308b9d7f/KIT_BUNDLE_WINDOWSSDK_MEDIACREATION/winsdksetup.exe' `
              -OutFile $installer
            $signature = Get-AuthenticodeSignature $installer
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notlike '*Microsoft*') {
              throw "Windows SDK installer signature is not valid: $($signature.Status)"
            }
            $process = Start-Process `
              -FilePath $installer `
              -ArgumentList '/features', 'OptionId.DesktopCPPx64', '/quiet', '/norestart' `
              -Wait `
              -PassThru
            if ($process.ExitCode -notin 0, 3010) {
              throw "Windows SDK installer failed with exit code $($process.ExitCode)"
            }
          }
          if (-not (Test-Path $sdkInclude)) {
            throw 'Windows SDK 10.0.28000.0 was not installed'
          }
          $resourceCompiler = "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.0.28000.0\x64\rc.exe"
          if (-not (Test-Path $resourceCompiler)) {
            throw 'Windows SDK 10.0.28000.0 resource compiler was not installed'
          }
          "RC=$resourceCompiler" >> $env:GITHUB_ENV
          Write-Host "Using Windows SDK 10.0.28000.0"

      - name: Download matching WebRTC prebuilt
        if: steps.prebuilt.outputs.run-id != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ steps.prebuilt.outputs.name }}
          ARTIFACT_RUN_ID: ${{ steps.prebuilt.outputs.run-id }}
        run: |
          for attempt in 1 2 3; do
            rm -rf build/external/libwebrtc
            if gh run download "$ARTIFACT_RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --name "$ARTIFACT_NAME" \
              --dir build/external/libwebrtc; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "Artifact download failed; retrying (attempt $((attempt + 1))/3)"
            sleep "$((attempt * 10))"
          done

      - name: Prepare WebRTC prebuilt layout
        if: steps.prebuilt.outputs.run-id != ''
        run: node scripts/prepare-webrtc-prebuilt.js

      - name: Find matching tested native addon
        id: native-addon
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_BASE: native-addon-${{ matrix.artifact_os || runner.os }}-${{ matrix.artifact_arch || runner.arch }}-node${{ matrix.node }}-${{ hashFiles('CMakeLists.txt', 'cmake/webrtc-common.cmake', matrix.webrtc_config, 'src/**', 'package.json', 'package-lock.json', 'scripts/build-from-source.js', 'scripts/clean-package-build.js', format('scripts/download-webrtc.{0}', matrix.script_suffix), format('scripts/configure-webrtc.{0}', matrix.script_suffix), format('scripts/build-webrtc.{0}', matrix.script_suffix), 'scripts/patch-webrtc-base64.sh', 'scripts/patch-webrtc-modern-cpp.py', 'scripts/patch-webrtc-media-defaults.sh', matrix.platform_patch_1, matrix.platform_patch_2) }}
          PRODUCER_JOB: ${{ matrix.label || matrix.os }} / node ${{ matrix.node }}
        run: |
          artifact_name="$ARTIFACT_BASE-${ImageOS:-unknown}"
          run_id=""
          while IFS= read -r candidate_run_id; do
            producer_status="$(
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_run_id/jobs?filter=latest&per_page=100" \
                --jq ".jobs[] | select(.name == \"$PRODUCER_JOB\") | .conclusion" |
              head -n 1
            )"
            if [ "$producer_status" = "success" ]; then
              run_id="$candidate_run_id"
              break
            fi
          done < <(
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$artifact_name&per_page=100" \
              --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[].workflow_run.id'
          )
          echo "name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
          if [ -n "$run_id" ]; then
            echo "Reusing content-addressed addon uploaded after platform tests in run $run_id"
          else
            echo "No matching addon from a successful $PRODUCER_JOB job; this job will compile it"
          fi

      - name: Download tested native addon
        if: steps.native-addon.outputs.run-id != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ steps.native-addon.outputs.name }}
          ARTIFACT_RUN_ID: ${{ steps.native-addon.outputs.run-id }}
        run: |
          for attempt in 1 2 3; do
            rm -rf reused-native-addon
            if gh run download "$ARTIFACT_RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --name "$ARTIFACT_NAME" \
              --dir reused-native-addon; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "Artifact download failed; retrying (attempt $((attempt + 1))/3)"
            sleep "$((attempt * 10))"
          done
          mkdir -p build
          addon_archive="$(find reused-native-addon -type f -name '*.tar.gz' -print -quit)"
          if [ -z "$addon_archive" ]; then
            echo "The native addon artifact contains no package archive" >&2
            exit 1
          fi
          tar -xzf "$addon_archive" -C build

      - name: Install package dependencies
        run: npm install --ignore-scripts --omit=dev

      - name: Compile native addon
        id: compile-native
        if: steps.native-addon.outputs.run-id == ''
        env:
          ARM_TOOLS_PATH: ${{ matrix.arm_tools_path }}
          CMAKE_GENERATOR: ${{ matrix.generator }}
          SKIP_DOWNLOAD: true
          TARGET_ARCH: ${{ matrix.target_arch }}
          USE_CLANG_CL: 1
          WEBRTC_PREBUILT: ${{ steps.prebuilt.outputs.run-id != '' && '1' || '0' }}
        run: npm run build

      - name: Stage WebRTC prebuilt
        id: stage-prebuilt
        if: ${{ !cancelled() && steps.prebuilt.outputs.run-id == '' && (steps.compile-native.outcome == 'success' || steps.compile-native.outcome == 'failure') }}
        run: node scripts/stage-webrtc-prebuilt.js

      - name: Preserve WebRTC prebuilt
        if: ${{ !cancelled() && steps.prebuilt.outputs.run-id == '' && steps.stage-prebuilt.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.prebuilt.outputs.name }}
          path: .webrtc-prebuilt/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

      - name: Smoke load addon
        if: matrix.cross_compile != true
        run: node -e "const wrtc=require('./'); console.log('wrtc ok', !!wrtc);"

      - name: Install test dependencies
        id: test-dependencies
        if: matrix.cross_compile != true
        run: npm install --ignore-scripts

      - name: Run native test suite
        if: matrix.cross_compile != true
        run: npm test

      - name: Setup minimum supported Node.js
        if: matrix.cross_compile != true
        uses: actions/setup-node@v7
        with:
          node-version: 24.15

      - name: Verify minimum supported Node.js
        if: matrix.cross_compile != true
        run: node -e "const wrtc=require('./'); const pc=new wrtc.RTCPeerConnection(); pc.close(); console.log('wrtc ok on', process.version);"

      - name: Restore build Node.js
        if: matrix.cross_compile != true
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Setup Web Platform Test Python
        if: matrix.run_wpt == true && needs.changes.outputs.wpt == 'true'
        uses: actions/setup-python@v6
        with:
          # The pinned WPT snapshot still imports collections.MutableMapping.
          python-version: '3.9'

      - name: Initialize Web Platform Tests
        if: matrix.run_wpt == true && needs.changes.outputs.wpt == 'true'
        run: |
          npm run wpt:init
          node scripts/patch-wpt-python3.js

      - name: Configure Web Platform Test hosts
        id: wpt-hosts
        if: matrix.run_wpt == true && needs.changes.outputs.wpt == 'true'
        continue-on-error: true
        working-directory: test/web-platform-tests/tests
        run: |
          node "$GITHUB_WORKSPACE/scripts/generate-wpt-hosts.js" | sudo tee -a /etc/hosts > /dev/null
          getent hosts web-platform.test

      - name: Run Web Platform Tests
        id: wpt
        if: ${{ !cancelled() && matrix.run_wpt == true && needs.changes.outputs.wpt == 'true' && steps.wpt-hosts.outcome == 'success' }}
        continue-on-error: true
        env:
          WPT_RESULTS_PATH: wpt-status/wpt-results.json
        run: npm run wpt:test

      - name: Generate WPT badge status
        if: ${{ !cancelled() && matrix.run_wpt == true && needs.changes.outputs.wpt == 'true' && steps.test-dependencies.outcome == 'success' }}
        id: wpt-badge
        shell: bash
        env:
          WPT_HOSTS_OUTCOME: ${{ steps.wpt-hosts.outcome }}
          WPT_OUTCOME: ${{ steps.wpt.outcome }}
        run: |
          mkdir -p wpt-status
          node scripts/summarize-wpt.js wpt-status/wpt-summary.json wpt-status/wpt-results.json
          if [ "$WPT_HOSTS_OUTCOME" != "success" ]; then
            status="setup error"
            color=orange
          elif [ "$WPT_OUTCOME" = "success" ]; then
            status=passing
            color=brightgreen
          else
            status=failing
            color=red
          fi
          node -e '
            const fs = require("fs");
            const summary = require("./wpt-status/wpt-summary.json");
            const status = process.argv[1];
            const observed = summary.observed;
            const message = observed
              ? `${observed.pass} pass · ${observed.fail} fail · ${observed.timeout} timeout · ${observed.skippedFiles} files skipped${status === "passing" ? "" : ` · ${status}`}`
              : `${status} · subtest results unavailable`;
            fs.writeFileSync("wpt-status/wpt-badge.json", JSON.stringify({
              schemaVersion: 1,
              label: "WPT",
              message,
              color: process.argv[2],
            }) + "\n");
          ' "$status" "$color"
          node -e '
            const summary = require("./wpt-status/wpt-summary.json");
            console.log(`### WPT plan\n\n- Expected pass: ${summary.expectedPass}\n- Expected fail: ${summary.expectedFail}\n- Skipped: ${summary.skipped}`);
            if (summary.observed) {
              const r = summary.observed;
              console.log(`\n### Actual WPT subtests\n\n- Pass: ${r.pass}\n- Fail (including expected failures): ${r.fail}\n- Timeout: ${r.timeout}\n- Not run: ${r.notRun}\n- Unknown status: ${r.unknown}\n- Harness errors: ${r.harnessErrors}\n- Unhandled exceptions: ${r.exceptions}\n- Completed / pending / skipped files: ${r.completedFiles} / ${r.pendingFiles} / ${r.skippedFiles}\n\nFull failure names and messages: wpt-status/wpt-results.json artifact. A green job means expectations matched, not full conformance.`);
            }
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve WPT badge status
        if: ${{ !cancelled() && steps.wpt-badge.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: wpt-status
          path: wpt-status/
          if-no-files-found: error
          retention-days: 90

      - name: Benchmark smoke
        if: matrix.cross_compile != true && needs.changes.outputs.performance == 'true'
        run: node benchmarks/run.js --iterations 1 --warmup 0 --messages 5

      - name: Find benchmark baseline
        id: benchmark-baseline
        if: matrix.cross_compile != true && needs.changes.outputs.performance == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Measure the combined optimizations against the published release.
          mkdir -p benchmarks/release-baseline
          release_archive="wrtc-v0.7.2-napi-v3-$(node -p 'process.platform')-$(node -p 'process.arch').tar.gz"
          gh release download v0.7.2 --repo "$GITHUB_REPOSITORY" \
            --pattern "$release_archive" --dir benchmarks/release-baseline
          tar -xzf "benchmarks/release-baseline/$release_archive" -C benchmarks/release-baseline
          echo "addon=benchmarks/release-baseline/Release/wrtc.node" >> "$GITHUB_OUTPUT"
          echo "ref=v0.7.2" >> "$GITHUB_OUTPUT"

      - name: Run stable benchmarks
        if: matrix.cross_compile != true && needs.changes.outputs.performance == 'true'
        shell: bash
        env:
          BASELINE_PATH: ${{ steps.benchmark-baseline.outputs.path }}
          BASELINE_ADDON: ${{ steps.benchmark-baseline.outputs.addon }}
          BENCHMARK_OUTPUT: benchmarks/results/${{ runner.os }}-${{ runner.arch }}.json
          PAIR_BENCHMARKS: 'true'
          BASELINE_REF: ${{ steps.benchmark-baseline.outputs.ref }}
        run: |
          if [ "$PAIR_BENCHMARKS" = "true" ] && [ -n "$BASELINE_ADDON" ]; then
            node benchmarks/run-paired.js \
              --baseline-addon "$BASELINE_ADDON" \
              --candidate-addon build/Release/wrtc.node \
              --baseline-ref "$BASELINE_REF" \
              --pairs 10 \
              --iterations 10 \
              --warmup 1 \
              --messages 10 \
              --output "$BENCHMARK_OUTPUT"
            exit 0
          fi
          baseline_args=()
          if [ -n "$BASELINE_PATH" ]; then
            baseline_args=(--baseline "$BASELINE_PATH")
          fi
          node benchmarks/run.js \
            --iterations 5 \
            --warmup 1 \
            --compare-runs 3 \
            --messages 10 \
            --output "$BENCHMARK_OUTPUT" \
            "${baseline_args[@]}"

      - name: Preserve benchmark result
        if: matrix.cross_compile != true && needs.changes.outputs.performance == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-${{ runner.os }}-${{ runner.arch }}
          path: benchmarks/results/${{ runner.os }}-${{ runner.arch }}.json
          if-no-files-found: error
          retention-days: 90

      - name: Package native addon
        env:
          TARGET_ARCH: ${{ matrix.target_arch }}
          TARGET_PLATFORM: ${{ matrix.cross_compile == true && 'linux' || '' }}
        run: npm run package-native-addon

      - name: Preserve native addon
        uses: actions/upload-artifact@v7
        with:
          name: wrtc-${{ matrix.artifact_os || runner.os }}-${{ matrix.artifact_arch || runner.arch }}
          path: build/stage/**/*.tar.gz
          if-no-files-found: error

      - name: Preserve content-addressed native addon
        if: matrix.cross_compile != true
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.native-addon.outputs.name }}
          path: build/stage/**/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  linux-arm64-validation:
    name: ubuntu-24.04-arm / node 26
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.source_build == 'true' }}
    needs:
      - changes
      - source-build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install Linux runtime dependencies
        timeout-minutes: 10
        run: bash scripts/install-linux-dependencies.sh libglib2.0-dev libasound2-dev libpulse-dev

      - name: Download tested Linux ARM64 addon
        uses: actions/download-artifact@v7
        with:
          name: wrtc-Linux-ARM64
          path: arm64-addon

      - name: Prepare project implementation
        shell: bash
        run: |
          mkdir -p build
          addon_archive="$(find arm64-addon -type f -name '*.tar.gz' -print -quit)"
          tar -xzf "$addon_archive" -C build
          npm install --ignore-scripts

      - name: Smoke load addon
        run: node -e "const wrtc=require('./'); const pc=new wrtc.RTCPeerConnection(); pc.close(); console.log('wrtc ok on', process.arch);"

      - name: Run native test suite
        run: npm test

      - name: Setup minimum supported Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.15

      - name: Verify minimum supported Node.js
        run: node -e "const wrtc=require('./'); const pc=new wrtc.RTCPeerConnection(); pc.close(); console.log('wrtc ok on', process.version);"

      - name: Name tested ARM64 addon cache
        id: native-addon-cache
        shell: bash
        run: |
          echo "name=native-addon-Linux-ARM64-node26-${{ hashFiles('CMakeLists.txt', 'cmake/webrtc-common.cmake', 'cmake/webrtc-linux.cmake', 'src/**', 'package.json', 'package-lock.json', 'scripts/build-from-source.js', 'scripts/clean-package-build.js', 'scripts/download-webrtc.sh', 'scripts/configure-webrtc.sh', 'scripts/build-webrtc.sh', 'scripts/patch-webrtc-base64.sh', 'scripts/patch-webrtc-modern-cpp.py', 'scripts/patch-webrtc-media-defaults.sh') }}-${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Preserve tested ARM64 addon cache
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.native-addon-cache.outputs.name }}
          path: arm64-addon/**/*.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Restore build Node.js
        if: needs.changes.outputs.performance == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Run stable benchmarks
        if: needs.changes.outputs.performance == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p benchmarks/release-baseline
          gh release download v0.7.2 --repo "$GITHUB_REPOSITORY" \
            --pattern 'wrtc-v0.7.2-napi-v3-linux-arm64.tar.gz' --dir benchmarks/release-baseline
          tar -xzf benchmarks/release-baseline/wrtc-v0.7.2-napi-v3-linux-arm64.tar.gz -C benchmarks/release-baseline
          node benchmarks/run-paired.js \
            --baseline-addon benchmarks/release-baseline/Release/wrtc.node \
            --candidate-addon build/Release/wrtc.node \
            --baseline-ref v0.7.2 \
            --pairs 10 \
            --iterations 10 \
            --warmup 1 \
            --messages 10 \
            --output benchmarks/results/Linux-ARM64.json

      - name: Preserve benchmark result
        if: needs.changes.outputs.performance == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-Linux-ARM64
          path: benchmarks/results/Linux-ARM64.json
          if-no-files-found: error
          retention-days: 90

  native-sanitizers:
    name: Linux native sanitizers
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.native == 'true' }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install build dependencies
        timeout-minutes: 10
        run: bash scripts/install-linux-dependencies.sh ninja-build libglib2.0-dev libasound2-dev libpulse-dev

      - name: Download matching WebRTC prebuilt
        id: sanitizer-prebuilt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: libwebrtc-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cmake/webrtc-common.cmake', 'cmake/webrtc-linux.cmake', 'scripts/download-webrtc.sh', 'scripts/configure-webrtc.sh', 'scripts/build-webrtc.sh', 'scripts/patch-webrtc-base64.sh', 'scripts/patch-webrtc-modern-cpp.py', 'scripts/patch-webrtc-media-defaults.sh', 'scripts/stage-webrtc-prebuilt.js') }}
        run: |
          artifact_name="$ARTIFACT_NAME-${ImageOS:-unknown}"
          run_id="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$artifact_name&per_page=100" \
              --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty'
          )"
          if [ -z "$run_id" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No matching Linux WebRTC prebuilt found; using the full correctness build path"
            exit 0
          fi
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "$artifact_name" --dir build/external/libwebrtc
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Prepare dependencies
        run: |
          if [ "${{ steps.sanitizer-prebuilt.outputs.found }}" = "true" ]; then
            node scripts/prepare-webrtc-prebuilt.js
          fi
          npm install --ignore-scripts

      - name: Build addon with sanitizers
        env:
          CMAKE_GENERATOR: Ninja
          SKIP_DOWNLOAD: ${{ steps.sanitizer-prebuilt.outputs.found == 'true' && 'true' || 'false' }}
          WEBRTC_PREBUILT: ${{ steps.sanitizer-prebuilt.outputs.found == 'true' && '1' || '0' }}
          WRTC_ENABLE_SANITIZERS: 1
        run: npm run build

      - name: Run native suite with sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          export LD_PRELOAD="$(cc -print-file-name=libasan.so)"
          npm test

      - name: Verify concurrent event queue batches
        run: |
          c++ -std=c++20 -pthread -fsanitize=address,undefined -I. test/event-queue.cc -o "$RUNNER_TEMP/event-queue-test"
          "$RUNNER_TEMP/event-queue-test"

  linux-performance-profile:
    name: Linux DataChannel performance profile
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.performance == 'true' }}
    needs:
      - changes
      - source-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Download tested Linux addon
        uses: actions/download-artifact@v7
        with:
          name: wrtc-Linux-X64
          path: profile-addon

      - name: Prepare project implementation
        shell: bash
        run: |
          mkdir -p build
          addon_archive="$(find profile-addon -type f -name '*.tar.gz' -print -quit)"
          tar -xzf "$addon_archive" -C build
          npm install --ignore-scripts

      - name: Install Linux profiler
        timeout-minutes: 10
        run: bash scripts/install-linux-dependencies.sh linux-tools-common linux-tools-generic

      - name: Capture binary DataChannel profile
        shell: bash
        run: |
          mkdir -p performance-profile
          sudo sysctl -w kernel.perf_event_paranoid=-1 || true
          sudo sysctl -w kernel.kptr_restrict=0 || true
          sudo --preserve-env=PATH perf record \
            --freq 499 \
            --call-graph dwarf \
            --output performance-profile/perf.data \
            -- node benchmarks/run.js \
              --scenario datachannel_binary_throughput_mib_per_second \
              --iterations 10 \
              --warmup 1 \
              --throughput-messages 5000 \
              --output performance-profile/benchmark.json
          sudo perf report \
            --stdio \
            --no-children \
            --input performance-profile/perf.data \
            > performance-profile/perf-report.txt
          sudo chown -R "$(id -u):$(id -g)" performance-profile

      - name: Preserve Linux performance profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-datachannel-performance-profile
          path: performance-profile
          if-no-files-found: warn
          retention-days: 30

  implementation-benchmarks:
    name: Compare Node WebRTC implementations
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.performance == 'true' }}
    needs:
      - changes
      - source-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Download tested Linux addon
        uses: actions/download-artifact@v7
        with:
          name: wrtc-Linux-X64
          path: comparison-addon

      - name: Prepare project implementation
        shell: bash
        run: |
          mkdir -p build
          addon_archive="$(find comparison-addon -type f -name '*.tar.gz' -print -quit)"
          tar -xzf "$addon_archive" -C build
          npm install --ignore-scripts

      - name: Benchmark project implementation
        run: |
          node benchmarks/run.js \
            --suite implementation-comparison \
            --implementation @vandeurenglenn/wrtc \
            --iterations 5 \
            --warmup 1 \
            --compare-runs 3 \
            --messages 10 \
            --output benchmarks/implementations/vandeurenglenn-wrtc.json

      - name: Reuse trusted alternative benchmark results
        id: alternative-cache
        if: needs.changes.outputs.alternative_benchmarks != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=benchmark-alternatives&per_page=100" \
              --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "develop")] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty'
          )"
          if [ -z "$run_id" ]; then
            echo "hit=false" >> "$GITHUB_OUTPUT"
            echo "No trusted alternative benchmark cache found; measuring alternatives"
            exit 0
          fi
          if ! gh run download "$run_id" \
              --repo "$GITHUB_REPOSITORY" \
              --name benchmark-alternatives \
              --dir benchmarks/implementations; then
            echo "hit=false" >> "$GITHUB_OUTPUT"
            echo "Trusted cache download failed; measuring alternatives"
            exit 0
          fi
          expected_key="${{ hashFiles('benchmarks/run.js', 'benchmarks/unsupported-result.js', 'scripts/benchmark-alternatives.sh') }}"
          cached_key="$(cat benchmarks/implementations/cache-key.txt 2>/dev/null || true)"
          if [ "$cached_key" != "$expected_key" ]; then
            rm -f benchmarks/implementations/*.json benchmarks/implementations/cache-key.txt
            echo "hit=false" >> "$GITHUB_OUTPUT"
            echo "Alternative benchmark cache does not match the current harness; measuring alternatives"
            exit 0
          fi
          if ! test -s benchmarks/implementations/koush-wrtc.json \
              || ! test -s benchmarks/implementations/roamhq-wrtc.json \
              || ! test -s benchmarks/implementations/werift.json; then
            rm -f benchmarks/implementations/*.json benchmarks/implementations/cache-key.txt
            echo "hit=false" >> "$GITHUB_OUTPUT"
            echo "Trusted cache is incomplete; measuring alternatives"
            exit 0
          fi
          echo "hit=true" >> "$GITHUB_OUTPUT"
          echo "Reusing alternative benchmarks from trusted run $run_id"

      - name: Setup legacy Node.js for Koush wrtc
        if: needs.changes.outputs.alternative_benchmarks == 'true' || steps.alternative-cache.outputs.hit != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 14.21.3

      - name: Benchmark Koush legacy implementation
        if: needs.changes.outputs.alternative_benchmarks == 'true' || steps.alternative-cache.outputs.hit != 'true'
        shell: bash
        run: bash scripts/benchmark-alternatives.sh legacy

      - name: Restore current Node.js
        if: needs.changes.outputs.alternative_benchmarks == 'true' || steps.alternative-cache.outputs.hit != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Benchmark alternative implementations
        if: needs.changes.outputs.alternative_benchmarks == 'true' || steps.alternative-cache.outputs.hit != 'true'
        shell: bash
        run: bash scripts/benchmark-alternatives.sh current

      - name: Preserve implementation results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-implementations
          path: benchmarks/implementations/*.json
          if-no-files-found: error
          retention-days: 90

  benchmark-report:
    name: Visual benchmark report
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.performance == 'true' }}
    needs:
      - changes
      - source-build
      - linux-arm64-validation
      - implementation-benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download benchmark results
        uses: actions/download-artifact@v7
        with:
          pattern: benchmark-*
          path: benchmark-artifacts

      - name: Download WPT badge status
        if: needs.changes.outputs.wpt == 'true'
        uses: actions/download-artifact@v7
        with:
          name: wpt-status
          path: wpt-status

      - name: Reuse latest WPT badge status
        if: needs.changes.outputs.wpt != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=wpt-status&per_page=100" \
              --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty'
          )"
          if [ -z "$run_id" ]; then
            echo "No reusable WPT status artifact found" >&2
            exit 1
          fi
          gh run download "$run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --name wpt-status \
            --dir wpt-status

      - name: Preserve reused WPT badge status
        if: needs.changes.outputs.wpt != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: wpt-status
          path: wpt-status/
          if-no-files-found: error
          retention-days: 90

      - name: Download benchmark history
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p benchmark-history
          gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base develop \
            --state merged \
            --limit 20 \
            --json headRefOid \
            --jq '.[].headRefOid' |
          while read -r head_sha; do
            run_id=""
            while IFS= read -r candidate_run_id; do
              report_status="$(
                gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_run_id/jobs?filter=latest&per_page=100" \
                  --jq '.jobs[] | select(.name == "Visual benchmark report") | .conclusion' |
                head -n 1
              )"
              if [ "$report_status" = "success" ]; then
                run_id="$candidate_run_id"
                break
              fi
            done < <(
              gh api "repos/$GITHUB_REPOSITORY/actions/workflows/cross-platform-source-build.yml/runs?event=pull_request&head_sha=$head_sha&per_page=10" \
                --jq '.workflow_runs[].id'
            )
            if [ -z "$run_id" ]; then
              continue
            fi
            gh run download "$run_id" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern 'benchmark-*' \
              --dir "benchmark-history/$run_id" || true
          done

      - name: Render benchmark report
        run: |
          node scripts/render-benchmark-report.js benchmark-artifacts benchmark-report benchmark-history wpt-status/wpt-summary.json
          cp wpt-status/wpt-badge.json benchmark-report/wpt-badge.json
          cp wpt-status/wpt-summary.json benchmark-report/wpt-summary.json

      - name: Add report to workflow summary
        run: cat benchmark-report/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve visual dashboard
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-dashboard
          path: benchmark-report/
          if-no-files-found: error
          retention-days: 90

      - name: Record tested benchmark revision
        shell: bash
        run: |
          mkdir -p benchmark-provenance
          # checkout tests the synthetic PR merge, not workflow_run.head_sha.
          git rev-parse HEAD > benchmark-provenance/tested-commit.txt

      - name: Preserve benchmark provenance
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-provenance
          path: benchmark-provenance/
          if-no-files-found: error
          retention-days: 90

  deploy-benchmark-pages:
    name: Publish benchmark dashboard
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Download compatible PR benchmark results
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          benchmark_run_id=""
          benchmark_paths=(
            CMakeLists.txt
            cmake
            src
            lib
            benchmarks/run.js
            benchmarks/run-paired.js
            benchmarks/unsupported-result.js
            package.json
            package-lock.json
            scripts/build-from-source.js
            scripts/build-macos-node26.sh
            scripts/build-webrtc.bat
            scripts/build-webrtc.sh
            scripts/configure-webrtc.bat
            scripts/configure-webrtc.sh
            scripts/download-webrtc.bat
            scripts/download-webrtc.sh
            scripts/prepare-webrtc-prebuilt.js
            scripts/stage-webrtc-prebuilt.js
          )

          while IFS=$'\t' read -r run_id head_sha; do
            report_status="$(
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?filter=latest&per_page=100" \
                --jq '.jobs[] | select(.name == "Visual benchmark report") | .conclusion' |
              head -n 1
            )"
            if [ "$report_status" != "success" ]; then
              continue
            fi
            # The PR head omits changes from its base that checkout may have
            # included in the tested merge. Never infer the tested tree from it.
            tested_sha="$head_sha"
            provenance_dir="$(mktemp -d "$RUNNER_TEMP/benchmark-provenance.XXXXXX")"
            if gh run download "$run_id" \
                --repo "$GITHUB_REPOSITORY" \
                --name benchmark-provenance \
                --dir "$provenance_dir"; then
              tested_sha="$(tr -d '\r\n' < "$provenance_dir/tested-commit.txt")"
              if [[ ! "$tested_sha" =~ ^[0-9a-f]{40}$ ]]; then
                echo "Invalid benchmark provenance in run $run_id; skipping" >&2
                continue
              fi
            else
              echo "Legacy run $run_id has no provenance; checking its PR head conservatively"
            fi
            if ! git cat-file -e "$tested_sha^{commit}" 2>/dev/null; then
              if ! git fetch --no-tags --depth=1 origin "$tested_sha"; then
                continue
              fi
            fi
            if ! git diff --quiet "$tested_sha" HEAD -- "${benchmark_paths[@]}"; then
              continue
            fi
            artifact_count="$(
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" \
                --jq '[.artifacts[] | select(.expired == false and (
                  .name == "benchmark-Linux-X64" or
                  .name == "benchmark-Linux-ARM64" or
                  .name == "benchmark-Windows-X64" or
                  .name == "benchmark-macOS-X64" or
                  .name == "benchmark-macOS-ARM64" or
                  .name == "benchmark-implementations" or
                  .name == "wpt-status"
                ))] | length'
            )"
            expected_artifacts="$(node --input-type=module -e \
              'import { nativePlatforms } from "./scripts/native-platforms.js"; console.log(nativePlatforms.length + 2)')"
            if [ "$artifact_count" -eq "$expected_artifacts" ]; then
              benchmark_run_id="$run_id"
              break
            fi
          done < <(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow cross-platform-source-build.yml \
              --event pull_request \
              --limit 100 \
              --json databaseId,headSha \
              --jq '.[] | [.databaseId, .headSha] | @tsv'
          )

          if [ -z "$benchmark_run_id" ]; then
            echo "No successful PR run has benchmark inputs compatible with develop" >&2
            exit 1
          fi

          echo "Rendering current dashboard from compatible PR run $benchmark_run_id"
          gh run download "$benchmark_run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'benchmark-*-*' \
            --dir benchmark-artifacts
          gh run download "$benchmark_run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --name benchmark-implementations \
            --dir benchmark-artifacts/benchmark-implementations
          gh run download "$benchmark_run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --name wpt-status \
            --dir wpt-status

      - name: Download benchmark history
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p benchmark-history
          gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base develop \
            --state merged \
            --limit 20 \
            --json headRefOid \
            --jq '.[].headRefOid' |
          while read -r head_sha; do
            run_id=""
            while IFS= read -r candidate_run_id; do
              report_status="$(
                gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_run_id/jobs?filter=latest&per_page=100" \
                  --jq '.jobs[] | select(.name == "Visual benchmark report") | .conclusion' |
                  head -n 1
              )"
              if [ "$report_status" = "success" ]; then
                run_id="$candidate_run_id"
                break
              fi
            done < <(
              gh api "repos/$GITHUB_REPOSITORY/actions/workflows/cross-platform-source-build.yml/runs?event=pull_request&head_sha=$head_sha&per_page=10" \
                --jq '.workflow_runs[].id'
            )
            if [ -z "$run_id" ]; then
              continue
            fi
            gh run download "$run_id" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern 'benchmark-*-*' \
              --dir "benchmark-history/$run_id" || true
          done

      - name: Render benchmark dashboard
        run: |
          node scripts/render-benchmark-report.js benchmark-artifacts benchmark-report benchmark-history wpt-status/wpt-summary.json
          cp wpt-status/wpt-badge.json benchmark-report/wpt-badge.json
          cp wpt-status/wpt-summary.json benchmark-report/wpt-summary.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: benchmark-report

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js for release
        uses: actions/setup-node@v7
        with:
          node-version: 24.15
          registry-url: https://registry.npmjs.org

      - name: Download exact-tree PR artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag_tree="$(git rev-parse 'HEAD^{tree}')"
          build_run_id=""
          expected_platforms="$(node --input-type=module -e \
            'import { nativePlatforms } from "./scripts/native-platforms.js"; console.log(nativePlatforms.length)')"

          while IFS=$'\t' read -r run_id head_sha; do
            candidate_tree="$(
              gh api "repos/$GITHUB_REPOSITORY/git/commits/$head_sha" \
                --jq '.tree.sha' 2>/dev/null || true
            )"
            if [ "$candidate_tree" != "$tag_tree" ]; then
              continue
            fi

            successful_build_jobs="$(
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?filter=latest&per_page=100" \
                --jq '[.jobs[] | select(.conclusion == "success" and (.name == "ubuntu-latest / node 26" or .name == "ubuntu-24.04-arm / node 26" or .name == "windows-2022 / node 26" or .name == "macos-latest / node 26" or .name == "macos-15-intel / node 26")) | .name] | unique | length'
            )"
            if [ "$successful_build_jobs" -ne "$expected_platforms" ]; then
              continue
            fi

            artifact_count="$(
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" \
                --jq '[.artifacts[] | select(.expired == false and (.name | startswith("wrtc-")))] | length'
            )"
            if [ "$artifact_count" -eq "$expected_platforms" ]; then
              build_run_id="$run_id"
              break
            fi
          done < <(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow cross-platform-source-build.yml \
              --event pull_request \
              --limit 100 \
              --json databaseId,headSha \
              --jq '.[] | [.databaseId, .headSha] | @tsv'
          )

          if [ -z "$build_run_id" ]; then
            echo "No PR run with $expected_platforms successful platform jobs and live artifacts matches tree $tag_tree" >&2
            exit 1
          fi

          echo "Promoting artifacts from PR workflow run $build_run_id"
          gh run download "$build_run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'wrtc-*' \
            --dir release-assets

      - name: Validate release inputs
        shell: bash
        run: |
          expected_tag="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $expected_tag" >&2
            exit 1
          fi

          asset_count="$(find release-assets -type f -name '*.tar.gz' | wc -l | tr -d ' ')"
          expected_platforms="$(node --input-type=module -e \
            'import { nativePlatforms } from "./scripts/native-platforms.js"; console.log(nativePlatforms.length)')"
          if [ "$asset_count" -ne "$expected_platforms" ]; then
            echo "Expected $expected_platforms native archives, found $asset_count" >&2
            find release-assets -type f -print
            exit 1
          fi

          while IFS= read -r asset; do
            tar -tzf "$asset" | grep -qx 'Release/wrtc.node'
          done < <(find release-assets -type f -name '*.tar.gz' | sort)

      - name: Generate checksums and SBOM
        shell: bash
        run: |
          npm install --ignore-scripts
          find release-assets -type f -name '*.tar.gz' -print0 \
            | sort -z \
            | xargs -0 sha256sum > release-assets/SHA256SUMS
          npm sbom --sbom-format cyclonedx > release-assets/sbom.cdx.json

      - name: Prepare npm release packages
        shell: bash
        run: |
          node scripts/create-native-platform-packages.js \
            release-assets \
            "$RUNNER_TEMP/native-platform-packages"
          node scripts/publish-native-platforms.js \
            --packages "$RUNNER_TEMP/native-platform-packages" \
            --pack "$RUNNER_TEMP/native-platform-tarballs"
          node scripts/publish-to-npm.js --pack "$RUNNER_TEMP/release-package"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mapfile -t assets < <(find release-assets -type f \( -name '*.tar.gz' -o -name 'SHA256SUMS' -o -name 'sbom.cdx.json' \) | sort)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --verify-tag \
              --generate-notes \
              --title "@vandeurenglenn/wrtc $GITHUB_REF_NAME"
          fi

      - name: Verify the packaged install path
        shell: bash
        run: |
          package_archive="$(find "$RUNNER_TEMP/release-package" -type f -name '*.tgz' -print -quit)"
          native_archive="$(find "$RUNNER_TEMP/native-platform-tarballs" -type f -name '*wrtc-linux-x64-*.tgz' -print -quit)"
          install_dir="$(mktemp -d)"
          cd "$install_dir"
          npm init -y >/dev/null
          npm install "$native_archive" "$package_archive"
          node -e "import('@vandeurenglenn/wrtc').then(wrtc => console.log('installed release ok', !!wrtc))"

      - name: Publish native platform packages to npm with provenance
        run: |
          node scripts/publish-native-platforms.js \
            --packages "$RUNNER_TEMP/native-platform-packages" \
            --provenance

      - name: Publish package to npm with provenance
        run: node scripts/publish-to-npm.js --provenance

      - name: Verify the public npm release
        run: node scripts/verify-npm-release.js

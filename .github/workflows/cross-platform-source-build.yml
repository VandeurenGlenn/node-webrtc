name: Cross Platform Source Build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop

jobs:
  source-build:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'windows-2019' || matrix.os == 'windows-latest' || matrix.os == 'windows-2022' }}
    strategy:
      fail-fast: false
      matrix:
        # windows-2019 is required for node-webrtc native builds because libwebrtc/Chromium only supports Visual Studio 2019/2017 toolchains.
        # windows-latest and windows-2022 only have VS2022, which is not recognized by upstream build scripts as of 2026.
        os: [ubuntu-latest, windows-2022]
        node: [26]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install ninja (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Install ninja (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ninja -y --no-progress

      - name: Build from source (Linux)
        if: runner.os == 'Linux'
        env:
          SKIP_DOWNLOAD: true
          CMAKE_GENERATOR: Ninja
        run: npm install

      - name: Build from source (Windows)
        if: runner.os == 'Windows'
        env:
          SKIP_DOWNLOAD: true
          CMAKE_GENERATOR: Ninja
        run: npm install

      - name: Smoke load addon
        run: node -e "const wrtc=require('./'); console.log('wrtc ok', !!wrtc);"

      - name: Benchmark smoke
        run: node benchmarks/run.js --iterations 1 --warmup 0 --messages 5

      - name: Package Linux addon
        if: runner.os == 'Linux'
        shell: bash
        run: |
          version=$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")
          test -s build/Release/wrtc.node
          mkdir -p artifacts
          tar -czf "artifacts/wrtc-v${version}-napi-v3-linux-x64.tar.gz" -C build/Release wrtc.node

      - name: Preserve tested Linux addon
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: wrtc-linux-x64
          path: artifacts/*.tar.gz
          if-no-files-found: error

name: Cross Platform Source Build

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    tags:
      - "v*"
  pull_request:
    branches:
      - develop
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tooling:
    name: Lint and dependency audit
    if: ${{ github.event_name != 'push' && !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.15

      - name: Install development dependencies
        run: npm install --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Build JavaScript library
        run: npm run build:lib

      - name: Verify generated library is current
        run: git diff --exit-code -- lib

      - name: Audit dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            audit_status=0
            npm audit --audit-level=low --json > npm-audit.json || audit_status=$?
            cat npm-audit.json
            if [ "$audit_status" -eq 0 ]; then
              exit 0
            fi
            if ! node -e 'const report=require("./npm-audit.json"); process.exit(report.error ? 0 : 1)'; then
              exit "$audit_status"
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Audit service unavailable; retrying ($attempt/3)"
              sleep 10
            fi
          done
          echo "::warning::npm audit service remained unavailable after 3 attempts"

  source-build:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    if: ${{ github.event_name != 'push' && !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout_minutes || 60 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 26
            generator: Ninja
            webrtc_config: cmake/webrtc-linux.cmake
            script_suffix: sh
            platform_patch_1: cmake/webrtc-linux.cmake
            platform_patch_2: cmake/webrtc-linux.cmake
            legacy_artifact: ""
          - os: windows-2022
            node: 26
            generator: Ninja
            webrtc_config: cmake/webrtc-windows.cmake
            script_suffix: bat
            platform_patch_1: scripts/patch-webrtc-windows.py
            platform_patch_2: scripts/patch-webrtc-boringssl-prefix.py
            legacy_artifact: ""
          - os: macos-latest
            node: 26
            generator: Ninja
            webrtc_config: cmake/webrtc-macos.cmake
            script_suffix: sh
            platform_patch_1: scripts/patch-webrtc-apple-clt.py
            platform_patch_2: scripts/patch-webrtc-apple-clt-modern.py
            legacy_artifact: ""
          - os: macos-15-intel
            node: 26
            timeout_minutes: 120
            generator: Ninja
            webrtc_config: cmake/webrtc-macos.cmake
            script_suffix: sh
            platform_patch_1: scripts/patch-webrtc-apple-clt.py
            platform_patch_2: scripts/patch-webrtc-apple-clt-modern.py
            legacy_artifact: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Locate Visual Studio 2022
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere `
            -latest `
            -version '[17.0,18.0)' `
            -products '*' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $installPath) {
            throw 'Visual Studio 2022 with C++ build tools was not found'
          }
          foreach ($command in 'clang-cl', 'lld-link', 'ninja') {
            if (-not (Get-Command $command -ErrorAction SilentlyContinue)) {
              throw "$command was not found on PATH"
            }
          }
          $resourceCompiler = Get-ChildItem `
            "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\rc.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $resourceCompiler) {
            throw 'The Windows SDK resource compiler was not found'
          }
          "vs2022_install=$installPath" >> $env:GITHUB_ENV
          "RC=$resourceCompiler" >> $env:GITHUB_ENV
          Write-Host "Using Visual Studio SDK from $installPath with clang-cl, lld-link, and Ninja"
          Write-Host "Using Windows resource compiler $resourceCompiler"

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libglib2.0-dev libasound2-dev libpulse-dev

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Find matching WebRTC prebuilt
        id: prebuilt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_BASE: libwebrtc-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cmake/webrtc-common.cmake', matrix.webrtc_config, format('scripts/download-webrtc.{0}', matrix.script_suffix), format('scripts/configure-webrtc.{0}', matrix.script_suffix), format('scripts/build-webrtc.{0}', matrix.script_suffix), 'scripts/patch-webrtc-base64.sh', 'scripts/patch-webrtc-modern-cpp.py', 'scripts/patch-webrtc-media-defaults.sh', matrix.platform_patch_1, matrix.platform_patch_2, 'scripts/stage-webrtc-prebuilt.js') }}
          LEGACY_ARTIFACT_NAME: ${{ matrix.legacy_artifact }}
        run: |
          ARTIFACT_NAME="$ARTIFACT_BASE-${ImageOS:-unknown}"
          run_id="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$ARTIFACT_NAME&per_page=100" \
              --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty'
          )"
          if [ -z "$run_id" ] && [ -n "$LEGACY_ARTIFACT_NAME" ]; then
            run_id="$(
              gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$LEGACY_ARTIFACT_NAME&per_page=100" \
                --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty'
            )"
            if [ -n "$run_id" ]; then
              ARTIFACT_NAME="$LEGACY_ARTIFACT_NAME"
              echo "Using verified legacy artifact while platform-specific keys are bootstrapped"
            fi
          fi
          echo "name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
          if [ -n "$run_id" ]; then
            echo "Found $ARTIFACT_NAME in run $run_id"
          else
            echo "No matching prebuilt; this job will perform a full WebRTC build"
          fi

      - name: Install Windows SDK 28000
        if: runner.os == 'Windows' && steps.prebuilt.outputs.run-id == ''
        shell: pwsh
        run: |
          $sdkInclude = "${env:ProgramFiles(x86)}\Windows Kits\10\Include\10.0.28000.0"
          if (-not (Test-Path $sdkInclude)) {
            $installer = Join-Path $env:RUNNER_TEMP 'winsdksetup.exe'
            Invoke-WebRequest `
              -Uri 'https://download.microsoft.com/download/38ab8f6d-3676-4860-ae84-3361308b9d7f/KIT_BUNDLE_WINDOWSSDK_MEDIACREATION/winsdksetup.exe' `
              -OutFile $installer
            $signature = Get-AuthenticodeSignature $installer
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notlike '*Microsoft*') {
              throw "Windows SDK installer signature is not valid: $($signature.Status)"
            }
            $process = Start-Process `
              -FilePath $installer `
              -ArgumentList '/features', 'OptionId.DesktopCPPx64', '/quiet', '/norestart' `
              -Wait `
              -PassThru
            if ($process.ExitCode -notin 0, 3010) {
              throw "Windows SDK installer failed with exit code $($process.ExitCode)"
            }
          }
          if (-not (Test-Path $sdkInclude)) {
            throw 'Windows SDK 10.0.28000.0 was not installed'
          }
          $resourceCompiler = "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.0.28000.0\x64\rc.exe"
          if (-not (Test-Path $resourceCompiler)) {
            throw 'Windows SDK 10.0.28000.0 resource compiler was not installed'
          }
          "RC=$resourceCompiler" >> $env:GITHUB_ENV
          Write-Host "Using Windows SDK 10.0.28000.0"

      - name: Download matching WebRTC prebuilt
        if: steps.prebuilt.outputs.run-id != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ steps.prebuilt.outputs.name }}
          ARTIFACT_RUN_ID: ${{ steps.prebuilt.outputs.run-id }}
        run: |
          gh run download "$ARTIFACT_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$ARTIFACT_NAME" \
            --dir build/external/libwebrtc

      - name: Prepare WebRTC prebuilt layout
        if: steps.prebuilt.outputs.run-id != ''
        run: node scripts/prepare-webrtc-prebuilt.js

      - name: Find matching tested native addon
        id: native-addon
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_BASE: native-addon-${{ runner.os }}-${{ runner.arch }}-node${{ matrix.node }}-${{ hashFiles('CMakeLists.txt', 'cmake/webrtc-common.cmake', matrix.webrtc_config, 'src/**', 'package.json', 'package-lock.json', 'scripts/build-from-source.js', 'scripts/clean-package-build.js', format('scripts/download-webrtc.{0}', matrix.script_suffix), format('scripts/configure-webrtc.{0}', matrix.script_suffix), format('scripts/build-webrtc.{0}', matrix.script_suffix), 'scripts/patch-webrtc-base64.sh', 'scripts/patch-webrtc-modern-cpp.py', 'scripts/patch-webrtc-media-defaults.sh', matrix.platform_patch_1, matrix.platform_patch_2) }}
          PRODUCER_JOB: ${{ matrix.os }} / node ${{ matrix.node }}
        run: |
          artifact_name="$ARTIFACT_BASE-${ImageOS:-unknown}"
          run_id=""
          while IFS= read -r candidate_run_id; do
            producer_status="$(
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_run_id/jobs?filter=latest&per_page=100" \
                --jq ".jobs[] | select(.name == \"$PRODUCER_JOB\") | .conclusion" |
              head -n 1
            )"
            if [ "$producer_status" = "success" ]; then
              run_id="$candidate_run_id"
              break
            fi
          done < <(
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$artifact_name&per_page=100" \
              --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[].workflow_run.id'
          )
          echo "name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
          if [ -n "$run_id" ]; then
            echo "Reusing content-addressed addon uploaded after platform tests in run $run_id"
          else
            echo "No matching addon from a successful $PRODUCER_JOB job; this job will compile it"
          fi

      - name: Download tested native addon
        if: steps.native-addon.outputs.run-id != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ steps.native-addon.outputs.name }}
          ARTIFACT_RUN_ID: ${{ steps.native-addon.outputs.run-id }}
        run: |
          gh run download "$ARTIFACT_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$ARTIFACT_NAME" \
            --dir reused-native-addon
          mkdir -p build
          addon_archive="$(find reused-native-addon -type f -name '*.tar.gz' -print -quit)"
          if [ -z "$addon_archive" ]; then
            echo "The native addon artifact contains no package archive" >&2
            exit 1
          fi
          tar -xzf "$addon_archive" -C build

      - name: Install package dependencies
        run: npm install --ignore-scripts --omit=dev

      - name: Compile native addon
        if: steps.native-addon.outputs.run-id == ''
        env:
          CMAKE_GENERATOR: ${{ matrix.generator }}
          SKIP_DOWNLOAD: true
          USE_CLANG_CL: 1
          WEBRTC_PREBUILT: ${{ steps.prebuilt.outputs.run-id != '' && '1' || '0' }}
        run: npm run build

      - name: Stage WebRTC prebuilt
        id: stage-prebuilt
        if: always() && steps.prebuilt.outputs.run-id == ''
        run: node scripts/stage-webrtc-prebuilt.js

      - name: Preserve WebRTC prebuilt
        if: always() && steps.prebuilt.outputs.run-id == '' && steps.stage-prebuilt.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.prebuilt.outputs.name }}
          path: .webrtc-prebuilt/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

      - name: Smoke load addon
        run: node -e "const wrtc=require('./'); console.log('wrtc ok', !!wrtc);"

      - name: Install test dependencies
        run: npm install --ignore-scripts

      - name: Run native test suite
        run: npm test

      - name: Setup minimum supported Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.15

      - name: Verify minimum supported Node.js
        run: node -e "const wrtc=require('./'); const pc=new wrtc.RTCPeerConnection(); pc.close(); console.log('wrtc ok on', process.version);"

      - name: Restore build Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Setup Web Platform Test Python
        if: runner.os == 'Linux'
        uses: actions/setup-python@v6
        with:
          # The pinned WPT snapshot still imports collections.MutableMapping.
          python-version: '3.9'

      - name: Initialize Web Platform Tests
        if: runner.os == 'Linux'
        run: npm run wpt:init

      - name: Configure Web Platform Test hosts
        id: wpt-hosts
        if: runner.os == 'Linux'
        continue-on-error: true
        working-directory: test/web-platform-tests/tests
        run: |
          ./wpt make-hosts-file | sudo tee -a /etc/hosts > /dev/null
          getent hosts web-platform.test

      - name: Run Web Platform Tests
        id: wpt
        if: runner.os == 'Linux' && steps.wpt-hosts.outcome == 'success'
        continue-on-error: true
        run: npm run wpt:test

      - name: Generate WPT badge status
        if: always() && runner.os == 'Linux'
        shell: bash
        env:
          WPT_HOSTS_OUTCOME: ${{ steps.wpt-hosts.outcome }}
          WPT_OUTCOME: ${{ steps.wpt.outcome }}
        run: |
          mkdir -p wpt-status
          if [ "$WPT_HOSTS_OUTCOME" != "success" ]; then
            message="setup error"
            color=orange
          elif [ "$WPT_OUTCOME" = "success" ]; then
            message=passing
            color=brightgreen
          else
            message=failing
            color=red
          fi
          node -e 'const fs=require("fs"); fs.writeFileSync("wpt-status/wpt-badge.json", JSON.stringify({schemaVersion:1,label:"WPT",message:process.argv[1],color:process.argv[2]}) + "\n")' "$message" "$color"

      - name: Preserve WPT badge status
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: wpt-status
          path: wpt-status/wpt-badge.json
          if-no-files-found: error
          retention-days: 90

      - name: Benchmark smoke
        run: node benchmarks/run.js --iterations 1 --warmup 0 --messages 5

      - name: Find benchmark baseline
        id: benchmark-baseline
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BENCHMARK_ARTIFACT: benchmark-${{ runner.os }}-${{ runner.arch }}
          PRODUCER_JOB: ${{ matrix.os }} / node ${{ matrix.node }}
        run: |
          mkdir -p benchmarks/ci-baseline
          develop_sha="$(gh api "repos/$GITHUB_REPOSITORY/branches/develop" --jq '.commit.sha')"
          develop_tree="$(
            gh api "repos/$GITHUB_REPOSITORY/git/commits/$develop_sha" --jq '.tree.sha'
          )"
          while IFS=$'\t' read -r run_id head_sha; do
            candidate_tree="$(
              gh api "repos/$GITHUB_REPOSITORY/git/commits/$head_sha" \
                --jq '.tree.sha' 2>/dev/null || true
            )"
            if [ "$candidate_tree" != "$develop_tree" ]; then
              continue
            fi
            producer_status="$(
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?filter=latest&per_page=100" \
                --jq ".jobs[] | select(.name == \"$PRODUCER_JOB\") | .conclusion" |
              head -n 1
            )"
            if [ "$producer_status" != "success" ]; then
              continue
            fi
            if gh run download "$run_id" \
              --repo "$GITHUB_REPOSITORY" \
              --name "$BENCHMARK_ARTIFACT" \
              --dir benchmarks/ci-baseline 2>/dev/null; then
              baseline_file="$(find benchmarks/ci-baseline -type f -name '*.json' | head -n 1)"
              if [ -n "$baseline_file" ]; then
                echo "path=$baseline_file" >> "$GITHUB_OUTPUT"
                echo "Using benchmark baseline from merged PR run $run_id"
                exit 0
              fi
            fi
          done < <(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow cross-platform-source-build.yml \
              --event pull_request \
              --limit 100 \
              --json databaseId,headSha \
              --jq '.[] | [.databaseId, .headSha] | @tsv'
          )
          echo "No platform baseline found; this run will establish one"

      - name: Run stable benchmarks
        shell: bash
        env:
          BASELINE_PATH: ${{ steps.benchmark-baseline.outputs.path }}
          BENCHMARK_OUTPUT: benchmarks/results/${{ runner.os }}-${{ runner.arch }}.json
        run: |
          baseline_args=()
          if [ -n "$BASELINE_PATH" ]; then
            baseline_args=(--baseline "$BASELINE_PATH")
          fi
          node benchmarks/run.js \
            --iterations 5 \
            --warmup 1 \
            --compare-runs 3 \
            --messages 10 \
            --output "$BENCHMARK_OUTPUT" \
            "${baseline_args[@]}"

      - name: Preserve benchmark result
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-${{ runner.os }}-${{ runner.arch }}
          path: benchmarks/results/${{ runner.os }}-${{ runner.arch }}.json
          if-no-files-found: error
          retention-days: 90

      - name: Package native addon
        run: npm run package-native-addon

      - name: Preserve tested native addon
        uses: actions/upload-artifact@v7
        with:
          name: wrtc-${{ runner.os }}-${{ runner.arch }}
          path: build/stage/**/*.tar.gz
          if-no-files-found: error

      - name: Preserve content-addressed native addon
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.native-addon.outputs.name }}
          path: build/stage/**/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  native-sanitizers:
    name: Linux native sanitizers
    if: ${{ github.event_name != 'push' && !startsWith(github.ref, 'refs/tags/v') }}
    needs: source-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libglib2.0-dev libasound2-dev libpulse-dev

      - name: Download matching WebRTC prebuilt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: libwebrtc-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cmake/webrtc-common.cmake', 'cmake/webrtc-linux.cmake', 'scripts/download-webrtc.sh', 'scripts/configure-webrtc.sh', 'scripts/build-webrtc.sh', 'scripts/patch-webrtc-base64.sh', 'scripts/patch-webrtc-modern-cpp.py', 'scripts/patch-webrtc-media-defaults.sh', 'scripts/stage-webrtc-prebuilt.js') }}
        run: |
          artifact_name="$ARTIFACT_NAME-${ImageOS:-unknown}"
          run_id="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$artifact_name&per_page=100" \
              --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty'
          )"
          if [ -z "$run_id" ]; then
            echo "No matching Linux WebRTC prebuilt found" >&2
            exit 1
          fi
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "$artifact_name" --dir build/external/libwebrtc

      - name: Prepare dependencies
        run: |
          node scripts/prepare-webrtc-prebuilt.js
          npm install --ignore-scripts

      - name: Build addon with sanitizers
        env:
          CMAKE_GENERATOR: Ninja
          SKIP_DOWNLOAD: true
          WEBRTC_PREBUILT: 1
          WRTC_ENABLE_SANITIZERS: 1
        run: npm run build

      - name: Run native suite with sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          export LD_PRELOAD="$(cc -print-file-name=libasan.so)"
          npm test

  linux-performance-profile:
    name: Linux DataChannel performance profile
    if: ${{ github.event_name != 'push' && !startsWith(github.ref, 'refs/tags/v') }}
    needs: source-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Download tested Linux addon
        uses: actions/download-artifact@v7
        with:
          name: wrtc-Linux-X64
          path: profile-addon

      - name: Prepare project implementation
        shell: bash
        run: |
          mkdir -p build
          addon_archive="$(find profile-addon -type f -name '*.tar.gz' -print -quit)"
          tar -xzf "$addon_archive" -C build
          npm install --ignore-scripts

      - name: Install Linux profiler
        run: |
          sudo apt-get update
          sudo apt-get install -y linux-tools-common linux-tools-generic

      - name: Capture binary DataChannel profile
        shell: bash
        run: |
          mkdir -p performance-profile
          sudo sysctl -w kernel.perf_event_paranoid=-1 || true
          sudo sysctl -w kernel.kptr_restrict=0 || true
          sudo --preserve-env=PATH perf record \
            --freq 499 \
            --call-graph dwarf \
            --output performance-profile/perf.data \
            -- node benchmarks/run.js \
              --scenario datachannel_binary_throughput_mib_per_second \
              --iterations 10 \
              --warmup 1 \
              --throughput-messages 5000 \
              --output performance-profile/benchmark.json
          sudo perf report \
            --stdio \
            --no-children \
            --input performance-profile/perf.data \
            > performance-profile/perf-report.txt
          sudo chown -R "$(id -u):$(id -g)" performance-profile

      - name: Preserve Linux performance profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-datachannel-performance-profile
          path: performance-profile
          if-no-files-found: warn
          retention-days: 30

  implementation-benchmarks:
    name: Compare Node WebRTC implementations
    if: ${{ github.event_name != 'push' && !startsWith(github.ref, 'refs/tags/v') }}
    needs: source-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Download tested Linux addon
        uses: actions/download-artifact@v7
        with:
          name: wrtc-Linux-X64
          path: comparison-addon

      - name: Prepare project implementation
        shell: bash
        run: |
          mkdir -p build
          addon_archive="$(find comparison-addon -type f -name '*.tar.gz' -print -quit)"
          tar -xzf "$addon_archive" -C build
          npm install --ignore-scripts

      - name: Benchmark project implementation
        run: |
          node benchmarks/run.js \
            --suite implementation-comparison \
            --implementation @vandeurenglenn/wrtc \
            --iterations 5 \
            --warmup 1 \
            --compare-runs 3 \
            --messages 10 \
            --output benchmarks/implementations/vandeurenglenn-wrtc.json

      - name: Setup legacy Node.js for Koush wrtc
        uses: actions/setup-node@v7
        with:
          node-version: 14.21.3

      - name: Benchmark Koush legacy implementation
        shell: bash
        run: |
          install_dir="$RUNNER_TEMP/webrtc-implementations/koush-wrtc"
          output="benchmarks/implementations/koush-wrtc.json"
          mkdir -p "$install_dir"
          if npm install --prefix "$install_dir" --no-package-lock 'wrtc@0.4.7'; then
            module_path="$(node -e 'console.log(require.resolve(process.argv[1], { paths: [process.argv[2]] }))' wrtc "$install_dir")"
            if node benchmarks/run.js \
              --suite implementation-comparison \
              --implementation 'Koush wrtc 0.4.7' \
              --module "$module_path" \
              --iterations 5 \
              --warmup 1 \
              --compare-runs 3 \
              --messages 10 \
              --output "$output"; then
              exit 0
            fi
            reason='installed on Node 14 but benchmark API is incompatible'
          else
            reason='package is unavailable on its legacy Node 14 runtime'
          fi
          node benchmarks/unsupported-result.js 'Koush wrtc 0.4.7' "$output" "$reason"

      - name: Restore current Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Benchmark alternative implementations
        shell: bash
        run: |
          benchmark_implementation() {
            label="$1"
            package_spec="$2"
            package_name="$3"
            output_name="$4"
            install_dir="$RUNNER_TEMP/webrtc-implementations/$output_name"
            output="benchmarks/implementations/$output_name.json"
            mkdir -p "$install_dir"
            if npm install --prefix "$install_dir" --no-package-lock "$package_spec"; then
              module_path="$(node -e 'console.log(require.resolve(process.argv[1], { paths: [process.argv[2]] }))' "$package_name" "$install_dir")"
              if node benchmarks/run.js \
                --suite implementation-comparison \
                --implementation "$label" \
                --module "$module_path" \
                --iterations 5 \
                --warmup 1 \
                --compare-runs 3 \
                --messages 10 \
                --output "$output"; then
                return
              fi
              reason="installed but benchmark API is incompatible"
            else
              reason="package is unavailable on Node ${NODE_VERSION:-26}"
            fi
            node benchmarks/unsupported-result.js "$label" "$output" "$reason"
          }

          benchmark_implementation '@roamhq/wrtc 0.10.0' '@roamhq/wrtc@0.10.0' '@roamhq/wrtc' 'roamhq-wrtc'
          benchmark_implementation 'werift 0.24.4' 'werift@0.24.4' 'werift' 'werift'

      - name: Preserve implementation results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-implementations
          path: benchmarks/implementations/*.json
          if-no-files-found: error
          retention-days: 90

  benchmark-report:
    name: Visual benchmark report
    if: ${{ github.event_name != 'push' && !startsWith(github.ref, 'refs/tags/v') }}
    needs:
      - source-build
      - implementation-benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download benchmark results
        uses: actions/download-artifact@v7
        with:
          pattern: benchmark-*
          path: benchmark-artifacts

      - name: Download WPT badge status
        uses: actions/download-artifact@v7
        with:
          name: wpt-status
          path: wpt-status

      - name: Download benchmark history
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p benchmark-history
          gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base develop \
            --state merged \
            --limit 20 \
            --json headRefOid \
            --jq '.[].headRefOid' |
          while read -r head_sha; do
            run_id=""
            while IFS= read -r candidate_run_id; do
              report_status="$(
                gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_run_id/jobs?filter=latest&per_page=100" \
                  --jq '.jobs[] | select(.name == "Visual benchmark report") | .conclusion' |
                head -n 1
              )"
              if [ "$report_status" = "success" ]; then
                run_id="$candidate_run_id"
                break
              fi
            done < <(
              gh api "repos/$GITHUB_REPOSITORY/actions/workflows/cross-platform-source-build.yml/runs?event=pull_request&head_sha=$head_sha&per_page=10" \
                --jq '.workflow_runs[].id'
            )
            if [ -z "$run_id" ]; then
              continue
            fi
            gh run download "$run_id" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern 'benchmark-*' \
              --dir "benchmark-history/$run_id" || true
          done

      - name: Render benchmark report
        run: |
          node scripts/render-benchmark-report.js benchmark-artifacts benchmark-report benchmark-history
          cp wpt-status/wpt-badge.json benchmark-report/wpt-badge.json

      - name: Add report to workflow summary
        run: cat benchmark-report/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve visual dashboard
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-dashboard
          path: benchmark-report/
          if-no-files-found: error
          retention-days: 90

  deploy-benchmark-pages:
    name: Publish benchmark dashboard
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download exact-tree PR dashboard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          develop_tree="$(git rev-parse 'HEAD^{tree}')"
          dashboard_run_id=""

          while IFS=$'\t' read -r run_id head_sha; do
            candidate_tree="$(
              gh api "repos/$GITHUB_REPOSITORY/git/commits/$head_sha" \
                --jq '.tree.sha' 2>/dev/null || true
            )"
            if [ "$candidate_tree" != "$develop_tree" ]; then
              continue
            fi
            report_status="$(
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?filter=latest&per_page=100" \
                --jq '.jobs[] | select(.name == "Visual benchmark report") | .conclusion' |
              head -n 1
            )"
            if [ "$report_status" != "success" ]; then
              continue
            fi
            artifact_count="$(
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" \
                --jq '[.artifacts[] | select(.expired == false and .name == "benchmark-dashboard")] | length'
            )"
            if [ "$artifact_count" -eq 1 ]; then
              dashboard_run_id="$run_id"
              break
            fi
          done < <(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow cross-platform-source-build.yml \
              --event pull_request \
              --limit 100 \
              --json databaseId,headSha \
              --jq '.[] | [.databaseId, .headSha] | @tsv'
          )

          if [ -z "$dashboard_run_id" ]; then
            echo "No dashboard from a successful benchmark-report job matches develop tree $develop_tree" >&2
            exit 1
          fi

          echo "Publishing dashboard from verified PR run $dashboard_run_id"
          gh run download "$dashboard_run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --name benchmark-dashboard \
            --dir benchmark-report

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: benchmark-report

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js for release
        uses: actions/setup-node@v7
        with:
          node-version: 24.15
          registry-url: https://registry.npmjs.org

      - name: Download exact-tree PR artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag_tree="$(git rev-parse 'HEAD^{tree}')"
          build_run_id=""

          while IFS=$'\t' read -r run_id head_sha; do
            candidate_tree="$(
              gh api "repos/$GITHUB_REPOSITORY/git/commits/$head_sha" \
                --jq '.tree.sha' 2>/dev/null || true
            )"
            if [ "$candidate_tree" != "$tag_tree" ]; then
              continue
            fi

            successful_build_jobs="$(
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?filter=latest&per_page=100" \
                --jq '[.jobs[] | select(.conclusion == "success" and (.name == "ubuntu-latest / node 26" or .name == "windows-2022 / node 26" or .name == "macos-latest / node 26" or .name == "macos-15-intel / node 26")) | .name] | unique | length'
            )"
            if [ "$successful_build_jobs" -ne 4 ]; then
              continue
            fi

            artifact_count="$(
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" \
                --jq '[.artifacts[] | select(.expired == false and (.name | startswith("wrtc-")))] | length'
            )"
            if [ "$artifact_count" -eq 4 ]; then
              build_run_id="$run_id"
              break
            fi
          done < <(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow cross-platform-source-build.yml \
              --event pull_request \
              --limit 100 \
              --json databaseId,headSha \
              --jq '.[] | [.databaseId, .headSha] | @tsv'
          )

          if [ -z "$build_run_id" ]; then
            echo "No PR run with four successful platform jobs and live artifacts matches tree $tag_tree" >&2
            exit 1
          fi

          echo "Promoting artifacts from PR workflow run $build_run_id"
          gh run download "$build_run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'wrtc-*' \
            --dir release-assets

      - name: Validate release inputs
        shell: bash
        run: |
          expected_tag="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $expected_tag" >&2
            exit 1
          fi

          asset_count="$(find release-assets -type f -name '*.tar.gz' | wc -l | tr -d ' ')"
          if [ "$asset_count" -ne 4 ]; then
            echo "Expected 4 native archives, found $asset_count" >&2
            find release-assets -type f -print
            exit 1
          fi

          while IFS= read -r asset; do
            tar -tzf "$asset" | grep -qx 'Release/wrtc.node'
          done < <(find release-assets -type f -name '*.tar.gz' | sort)

      - name: Generate checksums and SBOM
        shell: bash
        run: |
          npm install --ignore-scripts
          find release-assets -type f -name '*.tar.gz' -print0 \
            | sort -z \
            | xargs -0 sha256sum > release-assets/SHA256SUMS
          npm sbom --sbom-format cyclonedx > release-assets/sbom.cdx.json

      - name: Prepare npm release packages
        shell: bash
        run: |
          node scripts/create-native-platform-packages.js \
            release-assets \
            "$RUNNER_TEMP/native-platform-packages"
          node scripts/publish-native-platforms.js \
            --packages "$RUNNER_TEMP/native-platform-packages" \
            --pack "$RUNNER_TEMP/native-platform-tarballs"
          node scripts/publish-to-npm.js --pack "$RUNNER_TEMP/release-package"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mapfile -t assets < <(find release-assets -type f \( -name '*.tar.gz' -o -name 'SHA256SUMS' -o -name 'sbom.cdx.json' \) | sort)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --verify-tag \
              --generate-notes \
              --title "@vandeurenglenn/wrtc $GITHUB_REF_NAME"
          fi

      - name: Verify the published install path
        shell: bash
        run: |
          package_archive="$(find "$RUNNER_TEMP/release-package" -type f -name '*.tgz' -print -quit)"
          native_archive="$(find "$RUNNER_TEMP/native-platform-tarballs" -type f -name '*wrtc-linux-x64-*.tgz' -print -quit)"
          install_dir="$(mktemp -d)"
          cd "$install_dir"
          npm init -y >/dev/null
          npm install "$native_archive" "$package_archive"
          node -e "import('@vandeurenglenn/wrtc').then(wrtc => console.log('installed release ok', !!wrtc))"

      - name: Publish native platform packages to npm with provenance
        run: |
          node scripts/publish-native-platforms.js \
            --packages "$RUNNER_TEMP/native-platform-packages" \
            --provenance

      - name: Publish package to npm with provenance
        run: node scripts/publish-to-npm.js --provenance
